<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Avalie seu pedido – Açaí da Bru</title>
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <!-- Página de avaliação: o link chega pelo WhatsApp quando o pedido é marcado como Entregue.
       Cada pedido tem um código secreto (token): só quem recebeu o link consegue avaliar, uma vez. -->
  <style>
    :root { --vinho:#7A1F4B; --vinho-escuro:#2B0D1E; --dourado:#D4A24C; --borda:#EEDDE3; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', system-ui, sans-serif; background: #FFF9F2; color: #2B1420; min-height: 100vh;
           display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
    .card { width: 100%; max-width: 400px; background: #fff; border: 1px solid var(--borda); border-radius: 18px;
            padding: 28px 22px; box-shadow: 0 16px 40px rgba(43,13,30,.10); text-align: center; }
    .logo { height: 86px; width: auto; margin-bottom: 8px; }
    h1 { font-family: 'Montserrat', sans-serif; font-size: 1.3rem; font-weight: 800; color: var(--vinho-escuro); margin-bottom: 6px; }
    .sub { font-size: .9rem; color: #6b7280; margin-bottom: 18px; line-height: 1.5; }
    .estrelas { display: flex; justify-content: center; gap: 6px; margin-bottom: 6px; direction: ltr; }
    .estrela { background: none; border: none; cursor: pointer; font-size: 2.4rem; line-height: 1; color: #e5d9de; transition: transform .15s, color .15s; padding: 2px; }
    .estrela.on { color: var(--dourado); }
    .estrela:active { transform: scale(.9); }
    .estrela:focus-visible { outline: 2px solid var(--vinho); border-radius: 6px; }
    .nota-texto { font-size: .85rem; color: var(--vinho); font-weight: 600; min-height: 1.3em; margin-bottom: 14px; }
    form { text-align: left; display: flex; flex-direction: column; gap: 12px; }
    label { font-weight: 600; font-size: .85rem; display: block; margin-bottom: 5px; }
    textarea, input[type=text] { width: 100%; padding: 11px 12px; border: 1px solid var(--borda); border-radius: 10px; font-size: .95rem; font-family: inherit; }
    textarea { min-height: 90px; resize: vertical; }
    textarea:focus, input:focus { outline: none; border-color: var(--vinho); box-shadow: 0 0 0 3px rgba(122,31,75,.15); }
    .contador { font-size: .72rem; color: #9ca3af; text-align: right; margin-top: 3px; }
    .check { display: flex; gap: 8px; align-items: flex-start; font-size: .83rem; color: #4b5563; font-weight: 500; }
    .check input { margin-top: 2px; accent-color: var(--vinho); width: 16px; height: 16px; flex-shrink: 0; }
    button.principal { width: 100%; padding: 13px; border: none; border-radius: 999px; background: var(--vinho); color: #fff;
            font-weight: 700; font-size: 1rem; cursor: pointer; font-family: inherit; }
    button.principal:disabled { opacity: .45; cursor: not-allowed; }
    .msg { font-size: .88rem; border-radius: 10px; padding: 12px; line-height: 1.5; margin-top: 4px; }
    .msg.erro { background: #FDECEF; color: #9f1239; }
    .msg.ok { background: #EAF7EE; color: #166534; }
    a.link { display: inline-block; margin-top: 14px; color: var(--vinho); font-weight: 700; }
    .rodape { font-size: .72rem; color: #9ca3af; margin-top: 18px; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main class="card">
    <img class="logo" src="assets/logo.jpg" alt="Açaí da Bru">
    <div id="tela-form">
      <h1 id="titulo">Como foi seu pedido?</h1>
      <p class="sub">Sua opinião ajuda a gente a deixar cada açaí ainda melhor 💜</p>
      <div class="estrelas" role="radiogroup" aria-label="Nota de 1 a 5">
        <button type="button" class="estrela" data-n="1" role="radio" aria-checked="false" aria-label="1 estrela">★</button>
        <button type="button" class="estrela" data-n="2" role="radio" aria-checked="false" aria-label="2 estrelas">★</button>
        <button type="button" class="estrela" data-n="3" role="radio" aria-checked="false" aria-label="3 estrelas">★</button>
        <button type="button" class="estrela" data-n="4" role="radio" aria-checked="false" aria-label="4 estrelas">★</button>
        <button type="button" class="estrela" data-n="5" role="radio" aria-checked="false" aria-label="5 estrelas">★</button>
      </div>
      <p class="nota-texto" id="nota-texto">Toque nas estrelas</p>
      <form id="form" novalidate>
        <div>
          <label for="comentario">Quer contar mais? <span style="font-weight:400;color:#9ca3af">(opcional)</span></label>
          <textarea id="comentario" maxlength="500" placeholder="O que você mais gostou? O que podemos melhorar?"></textarea>
          <div class="contador"><span id="cont">0</span>/500</div>
        </div>
        <div>
          <label for="nome">Seu primeiro nome <span style="font-weight:400;color:#9ca3af">(opcional)</span></label>
          <input type="text" id="nome" maxlength="40" autocomplete="given-name" placeholder="Ex: Maria">
        </div>
        <label class="check"><input type="checkbox" id="publicar" checked> Pode mostrar meu comentário no site do Açaí da Bru</label>
        <div class="msg erro" id="erro" hidden></div>
        <button type="submit" class="principal" id="enviar" disabled>Enviar avaliação</button>
      </form>
    </div>
    <div id="tela-final" hidden>
      <h1 id="final-titulo">Obrigada! 💜</h1>
      <div class="msg ok" id="final-msg"></div>
      <a class="link" href="./">Ver o cardápio</a>
    </div>
    <p class="rodape">Açaí da Bru</p>
  </main>

  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
  <script>
const firebaseConfig = {
  apiKey: "AIzaSyCLBk9GA0kisT7aCm5HFBuRBqvShaycfys",
  authDomain: "acai-da-bru-41a8d.firebaseapp.com",
  projectId: "acai-da-bru-41a8d",
  storageBucket: "acai-da-bru-41a8d.firebasestorage.app",
  messagingSenderId: "356703842862",
  appId: "1:356703842862:web:d3de3f91843e4cfaf625bf"
};
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const $ = (id) => document.getElementById(id);
const params = new URLSearchParams(location.search);
const pedidoId = (params.get("id") || "").replace(/[^A-Za-z0-9_-]/g, "").slice(0, 60);
const token = (params.get("t") || "").replace(/[^a-f0-9]/gi, "").slice(0, 64);
const numero = (params.get("n") || "").replace(/\D/g, "").slice(0, 5);
if (numero) $("titulo").textContent = `Como foi seu pedido Nº ${numero}?`;

const finalizar = (titulo, html) => { $("tela-form").hidden = true; $("final-titulo").textContent = titulo; $("final-msg").innerHTML = html; $("tela-final").hidden = false; };
if (!pedidoId || !token) finalizar("Link incompleto", "Abra o link de avaliação direto da mensagem que você recebeu no WhatsApp.");

// Estrelas
let nota = 0;
const TEXTOS = ["", "Não gostei 😕", "Poderia ser melhor", "Foi bom", "Muito bom! 😋", "Perfeito! 🤩"];
const pintar = (n) => document.querySelectorAll(".estrela").forEach((b) => {
  const on = Number(b.dataset.n) <= n;
  b.classList.toggle("on", on);
  b.setAttribute("aria-checked", String(Number(b.dataset.n) === nota));
});
document.querySelectorAll(".estrela").forEach((b) => {
  b.addEventListener("click", () => { nota = Number(b.dataset.n); pintar(nota); $("nota-texto").textContent = TEXTOS[nota]; $("enviar").disabled = false; });
  b.addEventListener("mouseenter", () => pintar(Number(b.dataset.n)));
  b.addEventListener("mouseleave", () => pintar(nota));
});
$("comentario").addEventListener("input", () => { $("cont").textContent = $("comentario").value.length; });

$("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  if (!nota) return;
  const btn = $("enviar");
  btn.disabled = true; btn.textContent = "Enviando…"; $("erro").hidden = true;
  try {
    await db.collection("avaliacoes").doc(pedidoId).set({
      pedidoId, token, nota,
      comentario: $("comentario").value.trim().slice(0, 500),
      nome: $("nome").value.trim().split(/\s+/)[0].slice(0, 40),
      permitirPublicar: $("publicar").checked,
      aprovada: false,
      criadoEm: firebase.firestore.FieldValue.serverTimestamp(),
    });
    finalizar("Obrigada! 💜", nota >= 4
      ? "Que bom que você gostou! Sua avaliação chegou para a Bru. Até o próximo açaí! 🍧"
      : "Sua avaliação chegou para a Bru. Obrigada pela sinceridade — vamos caprichar ainda mais no próximo! 🍧");
  } catch (err) {
    if (err.code === "permission-denied") {
      finalizar("Esse pedido já foi avaliado", "Este link já foi usado (cada pedido pode ser avaliado uma vez) ou não é válido. Obrigada pelo carinho! 💜");
    } else {
      $("erro").hidden = false;
      $("erro").textContent = err.code === "unavailable" ? "Sem conexão com a internet. Confira e tente de novo." : "Não foi possível enviar agora. Tente de novo em instantes.";
      btn.disabled = false; btn.textContent = "Enviar avaliação";
    }
  }
});
  </script>
</body>
</html>
